[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyclescope"
version = "0.1.0"
description = "Independent cyclical-stock intelligence system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["SQLAlchemy>=2.0,<3.0", "pydantic>=2.7,<3.0", "pydantic-settings>=2.2,<3.0", "alembic>=1.13,<2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
cyclescope-init-db = "cyclescope.infrastructure.database.initialize:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cyclescope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cyclescope --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

